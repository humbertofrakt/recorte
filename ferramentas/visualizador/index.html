<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visualizador — Recorte</title>
<style>
  :root {
    --fundo: #f6f6f4;
    --papel: #ffffff;
    --borda: #d9d9d4;
    --texto: #1c1c1a;
    --suave: #6b6b64;
    --acento: #1d4ed8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--fundo);
    color: var(--texto);
    font: 16px/1.5 system-ui, "Segoe UI", Arial, sans-serif;
  }
  header {
    padding: 18px 24px 12px;
    border-bottom: 1px solid var(--borda);
    background: var(--papel);
  }
  header h1 { margin: 0; font-size: 20px; font-weight: 650; }
  header p { margin: 4px 0 0; color: var(--suave); font-size: 14px; }

  main {
    display: grid;
    grid-template-columns: 1fr 280px;
    gap: 20px;
    padding: 20px 24px 32px;
    align-items: start;
    max-width: 1200px;
    margin: 0 auto;
  }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }

  #palco {
    background: var(--papel);
    border: 1px solid var(--borda);
    border-radius: 10px;
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 520px; }

  .painel {
    background: var(--papel);
    border: 1px solid var(--borda);
    border-radius: 10px;
    padding: 16px;
  }
  .painel + .painel { margin-top: 16px; }
  .painel h2 {
    margin: 0 0 10px;
    font-size: 13px;
    font-weight: 650;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--suave);
  }

  .lista { display: flex; flex-direction: column; gap: 6px; }
  .lista button {
    text-align: left;
    padding: 8px 10px;
    border: 1px solid var(--borda);
    border-radius: 7px;
    background: var(--papel);
    color: var(--texto);
    font: inherit;
    cursor: pointer;
  }
  .lista button:hover { border-color: var(--acento); }
  .lista button[aria-pressed="true"] {
    border-color: var(--acento);
    background: #eaf0ff;
    color: var(--acento);
    font-weight: 600;
  }
  .lista small { display: block; color: var(--suave); font-weight: 400; font-size: 12px; }

  .botoes { display: flex; gap: 8px; }
  .botoes button {
    flex: 1;
    padding: 9px 4px;
    border: 1px solid var(--borda);
    border-radius: 7px;
    background: var(--papel);
    color: var(--texto);
    font: inherit;
    cursor: pointer;
  }
  .botoes button:hover { border-color: var(--acento); }

  label.linha { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
  input[type="range"] { width: 100%; }
  .valor { font-variant-numeric: tabular-nums; color: var(--suave); font-size: 14px; }

  #tempo { color: var(--suave); font-size: 14px; font-variant-numeric: tabular-nums; }
  #recado { margin: 0; color: var(--suave); font-size: 13px; }
  #recado.erro { color: #b91c1c; }
  #avisos { margin: 8px 0 0; padding-left: 18px; color: var(--suave); font-size: 12px; }
  #avisos:empty { display: none; }
</style>
</head>
<body>

<header>
  <h1>Visualizador — Recorte</h1>
  <p>Abre <code>heroi.bone</code> e desenha o esqueleto animado em Canvas 2D.</p>
</header>

<main>
  <div>
    <div id="palco"><canvas id="tela"></canvas></div>
    <p id="recado">Carregando…</p>
    <ul id="avisos"></ul>
  </div>

  <div>
    <section class="painel">
      <h2>Animações</h2>
      <div class="lista" id="animacoes"></div>
    </section>

    <section class="painel">
      <h2>Reprodução</h2>
      <div class="botoes">
        <button id="tocar" type="button">Tocar</button>
        <button id="parar" type="button">Parar</button>
        <button id="reiniciar" type="button">Reiniciar</button>
      </div>
      <p id="tempo">0.00 s</p>
      <label for="velocidade">Velocidade <span class="valor" id="velocidadeValor">1.0×</span></label>
      <input id="velocidade" type="range" min="0" max="2" step="0.05" value="1">
    </section>

    <section class="painel">
      <h2>Mostrar</h2>
      <label class="linha"><input type="checkbox" id="verOssos"> Ossos</label>
      <label class="linha"><input type="checkbox" id="verCaixas"> Caixas de colisão</label>
      <label class="linha"><input type="checkbox" id="verMalha"> Malha dos meshes</label>
      <label class="linha"><input type="checkbox" id="verMascara"> Máscara de recorte</label>
      <label class="linha"><input type="checkbox" id="verPontos"> Pontos e caminhos</label>
    </section>

    <section class="painel">
      <h2>Enquadramento</h2>
      <label for="zoom">Zoom <span class="valor" id="zoomValor">100%</span></label>
      <input id="zoom" type="range" min="0.2" max="3" step="0.05" value="1">
      <div class="botoes" style="margin-top:10px">
        <button id="enquadrar" type="button">Enquadrar</button>
      </div>
    </section>
  </div>
</main>

<script type="module" src="./visualizador.js"></script>
</body>
</html>
